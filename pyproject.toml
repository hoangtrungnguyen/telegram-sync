[project]
name = "tele-sync"
version = "0.1.0"
description = "Sync Telegram channel messages to a folder of Markdown files"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
telesync = "telesync.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telesync"]
